<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>山水有相逢 · Sơn Thủy Hữu Tương Phùng</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a5f56">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   山水有相逢 — Design tokens
   Bảng màu: sơn thủy cổ điển
   ============================================================ */
:root{
  --paper: #f2ead9;
  --paper-2: #e9dfc7;
  --paper-deep:#ddcfab;
  --ink: #24211c;
  --ink-soft: #52493c;
  --jade: #3e6b60;
  --jade-deep:#26443d;
  --jade-glow:#a9c9bd;
  --vermilion:#a8402f;
  --vermilion-soft:#c26a52;
  --gold:#b1873f;
  --gold-soft:#d8b978;
  --tone1:#c0463a; --tone2:#3e6b60; --tone3:#8a5a2d; --tone4:#4a4592; --tone0:#6b6558;
  --shadow: 0 20px 60px -20px rgba(20,15,5,.35);
  --radius: 4px;
  --dur: .6s;
  --bg: var(--paper);
  --bg2: var(--paper-2);
  --fg: var(--ink);
  --fg-soft: var(--ink-soft);
  --accent: var(--jade);
  --accent-deep: var(--jade-deep);
  --card-bg: rgba(255,251,240,.62);
  --card-bg-solid: rgba(248,242,226,.94);
  --card-border: rgba(60,50,30,.18);
  --line: rgba(60,50,30,.16);
}
html.dark{
  --bg:#0f1613;
  --bg2:#131c19;
  --fg:#e8e3d3;
  --fg-soft:#b9b2a0;
  --accent:#8fb8ab;
  --accent-deep:#5c8478;
  --card-bg: rgba(20,28,25,.55);
  --card-bg-solid: rgba(16,23,20,.92);
  --card-border: rgba(200,190,160,.14);
  --line: rgba(200,190,160,.14);
  --gold: #d8b978;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:'Noto Sans SC','Cormorant Garamond',serif;
  overflow-x:hidden; transition:background .5s ease,color .5s ease;
  min-height:100vh;
}
h1,h2,h3,.hanzi{font-family:'Noto Serif SC',serif;}
.brush{font-family:'Ma Shan Zheng',cursive;}
::selection{background:var(--gold-soft); color:#1c1c1c;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--accent); opacity:.4; border-radius:8px;}

/* ---------- Ink-wash mountain background (signature element) ---------- */
.scenery{position:fixed; inset:0; z-index:-2; overflow:hidden; pointer-events:none; contain:strict; transform:translateZ(0);}
.scenery svg{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:140%; min-width:1400px; height:auto;}
.scenery .sky{position:absolute; inset:0; background:
  radial-gradient(ellipse at 70% 8%, rgba(216,185,120,.28), transparent 45%),
  linear-gradient(180deg, var(--bg2) 0%, var(--bg) 55%, var(--bg) 100%);
  transition:background 1s ease;}
html.dark .scenery .sky{background:
  radial-gradient(ellipse at 75% 10%, rgba(200,190,150,.10), transparent 40%),
  linear-gradient(180deg,#0b100e 0%, #0f1613 60%, #0f1613 100%);}
/* Sương mù: dựng sẵn bằng gradient mềm (không dùng filter:blur) để tránh
   trình duyệt phải tính lại blur mỗi khung hình → chuyển động mượt, không giật.
   Dùng "alternate" thay vì lặp vòng để không bao giờ bị nhảy giật khi reset. */
.mist{position:absolute; left:-10%; width:120%; height:200px; pointer-events:none;
  background:radial-gradient(ellipse 40% 100% at 50% 50%, rgba(255,255,255,.20), rgba(255,255,255,.06) 55%, transparent 75%);
  opacity:.45; will-change:transform; transform:translate3d(0,0,0); backface-visibility:hidden;}
html.dark .mist{background:radial-gradient(ellipse 40% 100% at 50% 50%, rgba(170,195,185,.08), rgba(170,195,185,.03) 55%, transparent 75%);}
.mist.m1{top:12%; animation:driftSway 48s ease-in-out infinite alternate;}
.mist.m2{top:34%; animation:driftSway 62s ease-in-out infinite alternate-reverse;}
.mist.m3{top:58%; animation:driftSway 75s ease-in-out infinite alternate;}
@keyframes driftSway{from{transform:translate3d(0,0,0)}to{transform:translate3d(6%,0,0)}}
.moonsun{position:absolute; top:9%; right:14%; width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, var(--gold-soft), var(--gold) 70%);
  box-shadow:0 0 60px 10px rgba(216,185,120,.35); transition:background .6s ease, box-shadow .6s ease;
  will-change:transform; transform:translateZ(0);}
html.dark .moonsun{background:radial-gradient(circle at 35% 35%, #f4f1e6, #cfd6cf 70%); box-shadow:0 0 40px 8px rgba(220,225,215,.25);}

/* ---------- Layout shells ---------- */
#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}
header.top{display:flex; align-items:center; justify-content:space-between; padding:22px 5vw 10px; gap:16px;}
.brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
.brand .seal{width:44px; height:44px; border-radius:6px; background:var(--vermilion); color:#f6ead0; display:flex; align-items:center; justify-content:center; font-family:'Noto Serif SC'; font-weight:700; font-size:15px; box-shadow:var(--shadow); flex-shrink:0;}
.brand .title{display:flex; flex-direction:column; line-height:1.1;}
.brand .title b{font-size:22px; letter-spacing:.04em;}
.brand .title span{font-size:11px; color:var(--fg-soft); letter-spacing:.14em; text-transform:uppercase;}
nav.mainnav{display:flex; gap:6px; align-items:center;}
nav.mainnav button{background:transparent; border:1px solid transparent; color:var(--fg-soft); padding:9px 16px; border-radius:999px; font-size:13.5px; letter-spacing:.03em; transition:.3s;}
nav.mainnav button:hover{color:var(--fg); border-color:var(--line);}
nav.mainnav button.active{background:var(--card-bg); border-color:var(--card-border); color:var(--accent); font-weight:600;}
.icon-btn{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card-bg); display:flex; align-items:center; justify-content:center; color:var(--fg); font-size:17px; transition:.3s;}
.icon-btn:hover{border-color:var(--accent); color:var(--accent);}

main{flex:1; padding:0 5vw 60px; max-width:1180px; margin:0 auto; width:100%;}

.fade-in{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}

/* ---------- Hero / calligraphy reveal ---------- */
.hero{text-align:center; padding:38px 0 26px;}
.hero .poem{font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--fg-soft); font-size:16px; letter-spacing:.03em; margin-bottom:6px; opacity:0; animation:reveal 1s .1s ease forwards;}
.hero h1.brush{font-size:clamp(46px,8vw,86px); margin:6px 0 4px; color:var(--fg); position:relative; display:inline-block;
  clip-path:inset(0 100% 0 0); animation:wipe 1.4s .3s cubic-bezier(.65,0,.15,1) forwards;}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes reveal{to{opacity:1}}
.hero .sub{font-size:13.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); opacity:0; animation:reveal 1s .9s ease forwards;}

/* ---------- Stat cards ---------- */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:28px 0 40px;}
.stat{background:var(--card-bg-solid); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.stat::before{content:""; position:absolute; right:-30px; top:-30px; width:100px; height:100px; border-radius:50%; background:radial-gradient(circle, var(--accent) 0%, transparent 70%); opacity:.15;}
.stat .num{font-size:34px; font-weight:600; font-family:'Noto Serif SC'; color:var(--accent);}
.stat .lbl{font-size:12.5px; color:var(--fg-soft); letter-spacing:.06em; margin-top:2px;}
.progressbar{height:8px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:10px;}
.progressbar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--accent)); border-radius:6px; transition:width 1s cubic-bezier(.2,.7,.2,1);}

/* ---------- Category cards (stone tablets) ---------- */
.cat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:20px; margin-bottom:10px;}
.cat-card{background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:24px 20px; text-align:center; cursor:pointer; position:relative; box-shadow:var(--shadow); transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s; overflow:hidden;}
.cat-card:hover{transform:translateY(-8px); box-shadow:0 30px 70px -20px rgba(20,15,5,.45);}
.cat-card::after{content:""; position:absolute; inset:8px; border:1px solid var(--line); border-radius:2px; pointer-events:none;}
.cat-card .ring{width:78px; height:78px; margin:0 auto 12px;}
.cat-card h3{font-size:22px; margin:0 0 2px;}
.cat-card .py{font-size:12px; color:var(--fg-soft); letter-spacing:.08em;}
.cat-card .cnt{margin-top:10px; font-size:12px; color:var(--accent); letter-spacing:.05em;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; gap:8px; padding:11px 22px; border-radius:999px; border:1px solid var(--accent); background:var(--accent); color:#f4ecd8; font-size:13.5px; letter-spacing:.04em; font-weight:500; transition:.3s;}
.btn:hover{background:var(--accent-deep); border-color:var(--accent-deep);}
.btn.ghost{background:transparent; color:var(--accent); border-color:var(--accent);}
.btn.ghost:hover{background:var(--accent); color:#f4ecd8;}
.btn.small{padding:7px 14px; font-size:12px;}
.btn.vermilion{background:var(--vermilion); border-color:var(--vermilion);}
.btn.vermilion:hover{background:#8a2f21;}
.btn[disabled]{opacity:.4; pointer-events:none;}

/* ---------- Page header ---------- */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:14px; margin:26px 0 20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
.page-head h2{font-size:30px; margin:0; display:flex; align-items:baseline; gap:10px;}
.page-head h2 .py{font-size:14px; color:var(--fg-soft); font-family:'Cormorant Garamond'; font-style:italic;}
.back-link{font-size:13px; color:var(--fg-soft); display:flex; align-items:center; gap:5px; cursor:pointer;}
.back-link:hover{color:var(--accent);}

/* ---------- Mode toggle segmented ---------- */
.seg{display:inline-flex; background:var(--card-bg); border:1px solid var(--card-border); border-radius:999px; padding:4px;}
.seg button{border:none; background:transparent; padding:8px 18px; border-radius:999px; font-size:13px; color:var(--fg-soft);}
.seg button.active{background:var(--accent); color:#f4ecd8;}

/* ---------- Browse list (swipe) ---------- */
.browse-scroll{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; padding:8px 4px 24px;}
.browse-loadmore{display:flex; justify-content:center; padding:10px 0 30px;}
.browse-pagination{display:flex; align-items:center; justify-content:center; gap:8px; padding:20px 0 30px;}
.browse-pagination input[type="number"]{-moz-appearance:textfield;}
.browse-pagination input::-webkit-outer-spin-button, .browse-pagination input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.word-tile{background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); position:relative; min-height:150px;}
.word-tile .hz{font-size:38px; font-family:'Noto Serif SC'; margin-bottom:4px;}
.word-tile .py{font-size:14px; margin-bottom:8px;}
.word-tile .hv{font-size:13px; color:var(--gold); font-weight:600;}
.word-tile .vi{font-size:12.5px; color:var(--fg-soft); margin-top:2px;}
.tone-row{display:flex; gap:2px;}
.fav-star{position:absolute; top:14px; right:14px; font-size:16px; color:var(--fg-soft); opacity:.5; transition:.2s;}
.stt-badge{position:absolute; top:14px; left:14px; font-size:11px; color:var(--fg-soft); background:var(--bg2); border:1px solid var(--line); border-radius:999px; width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
.fav-star.active{color:var(--vermilion); opacity:1;}
.play-btn{position:absolute; bottom:14px; right:14px; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--accent);}

/* ---------- Flashcard ---------- */
.fc-wrap{display:flex; flex-direction:column; align-items:center; gap:22px; padding:20px 0 40px;}
.fc-scene{width:min(92vw,460px); height:320px; perspective:1600px;}
.fc-card{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .7s cubic-bezier(.2,.8,.2,1); cursor:pointer;}
.fc-card.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:8px; border:1px solid var(--card-border); background:var(--card-bg); box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px; text-align:center;}
.fc-face.back{transform:rotateY(180deg); overflow-y:auto; justify-content:flex-start; gap:8px;}
.fc-face::before{content:""; position:absolute; inset:10px; border:1px solid var(--line); border-radius:4px; pointer-events:none;}
.fc-face .hz{font-size:64px; font-family:'Noto Serif SC'; font-weight:600;}
.fc-face .py-big{font-size:20px; margin-top:8px; letter-spacing:.02em;}
.fc-face .hint{font-size:11px; color:var(--fg-soft); margin-top:20px; letter-spacing:.1em; text-transform:uppercase;}
.fc-face.back .hz{font-size:40px; margin-top:6px;}
.fc-face.back .hv{color:var(--gold); font-weight:700; font-size:15px;}
.fc-face.back .vi{color:var(--fg-soft); font-size:13.5px;}
.fc-face.back .ex{font-size:13px; margin-top:6px; border-top:1px dashed var(--line); padding-top:8px; width:100%;}
.fc-face.back .ex .zh{font-size:16px;}
.fc-face.back .ex .expy{font-size:12px; color:var(--fg-soft); margin-top:2px; letter-spacing:.02em;}
.fc-face.back .ex .vi2{color:var(--fg-soft); font-style:italic; font-size:12.5px;}
.fc-controls{display:flex; gap:14px; align-items:center;}
.fc-nav{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--card-bg); font-size:18px; color:var(--accent);}
.fc-meta{display:flex; gap:16px; font-size:12px; color:var(--fg-soft); align-items:center;}
.familiarity-dots{display:flex; gap:3px;}
.familiarity-dots i{width:7px; height:7px; border-radius:50%; background:var(--line); display:inline-block;}
.familiarity-dots i.on{background:var(--accent);}
.grade-row{display:flex; gap:10px; margin-top:6px;}

/* ---------- Manage page ---------- */
.manage-bar{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:22px; align-items:center;}
.input, select{background:var(--card-bg); border:1px solid var(--card-border); color:var(--fg); padding:10px 14px; border-radius:6px; font-size:13.5px; font-family:inherit;}
.input:focus, select:focus{outline:none; border-color:var(--accent);}
.word-row{display:grid; grid-template-columns:90px 1fr 1fr auto; gap:14px; align-items:center; padding:14px 16px; border:1px solid var(--card-border); border-radius:6px; background:var(--card-bg); margin-bottom:10px;}
.word-row .hz{font-size:28px; font-family:'Noto Serif SC';}
.word-row .meta{font-size:12px; color:var(--fg-soft);}
.word-row .actions{display:flex; gap:8px;}
.icon-mini{width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:13px;}
.icon-mini[disabled]{opacity:.35; pointer-events:none;}
.icon-mini:hover{border-color:var(--accent); color:var(--accent);}

/* ---------- Modal ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(10,8,4,.55); backdrop-filter:blur(3px); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeUp .3s ease;}
.modal{width:min(600px,92vw); max-height:88vh; overflow-y:auto; background:var(--bg); border:1px solid var(--card-border); border-radius:8px; padding:28px; box-shadow:0 30px 90px rgba(0,0,0,.5);}
.modal h3{margin-top:0;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-grid label{font-size:11.5px; color:var(--fg-soft); letter-spacing:.05em; display:block; margin-bottom:4px;}
.form-grid .full{grid-column:1/-1;}
.form-grid textarea{width:100%; background:var(--card-bg); border:1px solid var(--card-border); color:var(--fg); border-radius:6px; padding:10px; font-family:inherit; font-size:13.5px; resize:vertical;}
.form-grid .input{width:100%;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

/* ---------- Quiz ---------- */
.quiz-setup{display:flex; flex-direction:column; gap:22px; align-items:center; padding:30px 0;}
.quiz-opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; width:100%; max-width:640px;}
.quiz-opt{padding:16px; border:1px solid var(--card-border); background:var(--card-bg); border-radius:8px; text-align:center; cursor:pointer;}
.quiz-opt.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset;}
.quiz-q{max-width:560px; margin:0 auto; text-align:center; padding:20px 0;}
.quiz-q .hz{font-size:56px; font-family:'Noto Serif SC'; margin-bottom:24px;}
.quiz-answers{display:grid; gap:12px; grid-template-columns:1fr 1fr;}
.ans-btn{padding:16px; border-radius:8px; border:1px solid var(--card-border); background:var(--card-bg); font-size:15px; transition:.25s;}
.ans-btn:hover{border-color:var(--accent);}
.ans-btn.correct{background:#3e6b60; color:#fff; border-color:#3e6b60;}
.ans-btn.wrong{background:var(--vermilion); color:#fff; border-color:var(--vermilion);}
.quiz-progress{max-width:560px; margin:0 auto 10px;}
.quiz-result{text-align:center; padding:30px 0; display:flex; flex-direction:column; align-items:center; gap:16px;}
.donut{width:200px; height:200px;}

/* ---------- AI Tutor ---------- */
.tutor-wrap{display:flex; flex-direction:column; height:66vh; max-width:760px; margin:0 auto; border:1px solid var(--card-border); border-radius:10px; background:var(--card-bg); overflow:hidden;}
.tutor-msgs{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:80%; padding:12px 16px; border-radius:12px; font-size:14px; line-height:1.6; white-space:pre-wrap;}
.msg.user{align-self:flex-end; background:var(--accent); color:#f4ecd8; border-bottom-right-radius:2px;}
.msg.ai{align-self:flex-start; background:var(--bg2); border:1px solid var(--card-border); border-bottom-left-radius:2px;}
.tutor-quick{display:flex; gap:8px; flex-wrap:wrap; padding:10px 16px; border-top:1px solid var(--line);}
.tutor-quick button{font-size:11.5px; padding:6px 12px; border-radius:999px; border:1px solid var(--card-border); background:var(--bg2); color:var(--fg-soft);}
.tutor-input{display:flex; gap:10px; padding:14px; border-top:1px solid var(--line);}
.tutor-input input{flex:1;}
.typing{display:flex; gap:4px; align-items:center;}
.typing i{width:6px; height:6px; border-radius:50%; background:var(--accent); animation:blink 1s infinite ease-in-out;}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

.empty{text-align:center; padding:60px 20px; color:var(--fg-soft);}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:12px 22px; border-radius:999px; font-size:13px; box-shadow:var(--shadow); z-index:100; animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,10px)} to{opacity:1; transform:translate(-50%,0)}}

@media(max-width:720px){
  .stats{grid-template-columns:1fr 1fr;}
  header.top{flex-wrap:wrap;}
  nav.mainnav{order:3; width:100%; overflow-x:auto; justify-content:flex-start;}
  .quiz-answers{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
</style>
</head>
<body>

<div class="scenery">
  <div class="sky"></div>
  <div class="moonsun" id="moonsun"></div>
  <div class="mist m1"></div>
  <div class="mist m2"></div>
  <div class="mist m3"></div>
  <!-- Layered ink-wash mountains, hand-authored SVG -->
  <svg viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" id="mtnSvg">
    <defs>
      <linearGradient id="gFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--jade-glow)" stop-opacity=".35"/>
        <stop offset="1" stop-color="var(--jade-glow)" stop-opacity=".05"/>
      </linearGradient>

  'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4};
  for(const ch of py){ if(m[ch]) return m[ch]; }

}

  const counters = {};
  SEED_WORDS.forEach(word=>{
    counters[word.cat] = (counters[word.cat]||0) + 1;
    word.stt = counters[word.cat];
  });
})();
function nextSttFor(catId){
  const max = State.words.filter(w=>w.cat===catId).reduce((m,w)=>Math.max(m, w.stt||0), 0);
  return max + 1;
}
/* Tạo hàng loạt từ demo (đánh dấu isDemo:true) để kiểm thử các tính năng phụ thuộc số lượng,
   ví dụ phân trang "Duyệt từ" — chỉ hiện khi 1 mục có hơn 60 từ. Xóa sạch được, không ảnh hưởng
   tới từ vựng thật do người dùng hoặc dữ liệu mẫu tạo ra. */
async function generateDemoWords(catId, count){
  let stt = nextSttFor(catId);
  const ts = Date.now();
  for(let i=1;i<=count;i++){
    const n = stt + i - 1;
    const word = {
      id: `demo_${catId}_${ts}_${i}`,
      cat: catId, stt: n,
      hz: `测${n}`, py: `cè ${n}`,
      hanViet: `Trắc ${n}`, nghiaViet: `Từ demo số ${n}`,
      exampleZh: `这是第${n}个测试词。`, examplePy: `zhè shì dì ${n} gè cè shì cí.`,
      exampleVi: `Đây là từ demo thứ ${n}.`,
      reviewCount:0, familiarity:0, favorite:false, isUser:true, isDemo:true, createdAt:Date.now(),
    };
    await dbPut(word);
    State.words.push(word);
  }
  syncPushDebounced();
}
async function deleteAllDemoWords(){
  const demos = State.words.filter(w=>w.isDemo);
  for(const w of demos) await dbDelete(w.id);
  State.words = State.words.filter(w=>!w.isDemo);
  syncPushDebounced();
}
/* Vá dữ liệu cũ: nếu người dùng đã có từ vựng lưu từ bản trước (chưa có trường stt),
   tự động gán STT tiếp theo cho những từ đó theo từng mục, không ảnh hưởng STT đã có. */
async function migrateMissingStt(){
  const counters = {};
  CATEGORIES.forEach(c=>{
    counters[c.id] = State.words.filter(w=>w.cat===c.id && w.stt>0).reduce((m,w)=>Math.max(m,w.stt),0);
  });
  let changed = false;
  for(const word of State.words){
    if(!word.stt || word.stt<=0){
      counters[word.cat] = (counters[word.cat]||0) + 1;
      word.stt = counters[word.cat];
      await dbPut(word);
      changed = true;
    }
  }
  if(changed) syncPushDebounced();
}
function sortByStt(list){
  return list.slice().sort((a,b)=>(a.stt||0)-(b.stt||0));
}

/* ---------------------- 2. TẦNG LƯU TRỮ: IndexedDB ---------------------- */
const DB_NAME='SonThuyDB', DB_VER=1, STORE='words';
let dbInstance=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        const os = db.createObjectStore(STORE, {keyPath:'id'});
        os.createIndex('cat','cat',{unique:false});
      }
    };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = e=>reject(e);
  });
}
async function getDB(){ if(!dbInstance) dbInstance = await openDB(); return dbInstance; }
async function dbGetAll(){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess=()=>resolve(req.result);
    req.onerror=e=>reject(e);
  });
}
async function dbPut(word){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(word);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e);
  });
}
async function dbDelete(id){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e);
  });
}
async function dbClearAll(){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).clear();
    tx.oncomplete=()=>resolve();
    tx.onerror=e=>reject(e);
  });
}
async function seedIfEmpty(){
  const all = await dbGetAll();
  if(all.length===0){
    for(const word of SEED_WORDS) await dbPut(word);
    return SEED_WORDS.slice();
  }
  return all;
}

/* ---------------------- 4. localStorage: tiến độ & cài đặt ---------------------- */
const LS = {
  get(key, def){ try{ const v = localStorage.getItem('sonthuy_'+key); return v===null?def:JSON.parse(v);}catch(e){return def;} },
  set(key, val){ localStorage.setItem('sonthuy_'+key, JSON.stringify(val)); }
};
function bumpStreak(){
  const today = new Date().toDateString();
  const last = LS.get('lastDate', null);
  let streak = LS.get('streak', 0);
  if(last !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    streak = (last === y.toDateString()) ? streak+1 : 1;
    LS.set('streak', streak);
    LS.set('lastDate', today);
  }
  return streak;
}

/* ---------------------- 4b. ĐỒNG BỘ ĐA THIẾT BỊ (Firebase Firestore) ----------------------
   App gốc chỉ lưu IndexedDB/localStorage — dữ liệu nằm trên từng máy, không tự đồng bộ.
   Module này kết nối tới Firestore (đám mây, miễn phí) để mọi thiết bị dùng chung 1 "mã đồng bộ"
   có thể đọc/ghi cùng một tài liệu dữ liệu (từ vựng + nội dung + tiến độ).
   Người dùng cần tự tạo 1 project Firebase miễn phí và dán cấu hình vào trang Cài đặt. */
const Sync = {
  app:null, db:null, unsub:null, code:null, config:null,
  connected:false, lastSyncAt:null, lastWriteId:null, pushTimer:null,
};
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('Không tải được '+src));
    document.head.appendChild(s);
  });
}
async function ensureFirebaseSDK(){
  if(window.firebase && window.firebase.firestore) return;
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
}
function genSyncCode(){
  const chars='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<8;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function syncDocRef(){
  return Sync.db.collection('sonthuy_sync').doc(Sync.code);
}
/* Gom dữ liệu hiện tại của thiết bị thành 1 snapshot để đẩy lên đám mây */
function buildLocalSnapshot(){
  return {
    words: State.words,
    content: CONTENT,
    stats: { streak: LS.get('streak',0), lastDate: LS.get('lastDate',null) },
    writeId: Sync.lastWriteId = 'w'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
}
async function pushToCloud(){
  if(!Sync.connected) return;
  try{ await syncDocRef().set(buildLocalSnapshot(), {merge:false}); Sync.lastSyncAt = new Date(); }
  catch(err){ showToast('Đồng bộ lỗi: '+err.message); }
}
function syncPushDebounced(){
  if(!Sync.connected) return;
  clearTimeout(Sync.pushTimer);
  Sync.pushTimer = setTimeout(pushToCloud, 1000);
}
/* Áp dụng dữ liệu từ đám mây xuống thiết bị hiện tại (ghi đè local) */
async function applyRemoteData(data){
  if(Array.isArray(data.words)){
    await dbClearAll();
    for(const word of data.words) await dbPut(word);
    State.words = data.words;
  }
  if(data.content){
    CONTENT = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONTENT)), data.content);
    CONTENT.categories = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONTENT.categories)), data.content.categories||{});
    saveContent();
    document.title = CONTENT.brandTitle + ' · ' + CONTENT.brandSub;
  }
  if(data.stats){
    if(data.stats.streak!=null) LS.set('streak', data.stats.streak);
    if(data.stats.lastDate!=null) LS.set('lastDate', data.stats.lastDate);
  }
  render();
}
async function connectSync(configObj, code){
  await ensureFirebaseSDK();
  if(!Sync.app){ Sync.app = firebase.initializeApp(configObj); }
  Sync.db = firebase.firestore();
  Sync.config = configObj; Sync.code = code;
  const ref = syncDocRef();
  const snap = await ref.get();
  if(snap.exists){
    const useRemote = confirm('Đã tìm thấy dữ liệu đồng bộ trên đám mây cho mã "'+code+'".\n\nOK = Tải dữ liệu đám mây về thiết bị này (ghi đè).\nHủy = Đẩy dữ liệu hiện tại của thiết bị này lên đám mây (ghi đè đám mây).');
    if(useRemote){ await applyRemoteData(snap.data()); }
    else { Sync.connected = true; await pushToCloud(); }
  } else {
    Sync.connected = true;
    await pushToCloud();
  }
  Sync.connected = true;
  LS.set('syncConfig', {config:configObj, code});
  // Lắng nghe realtime: khi thiết bị khác cập nhật, tự động đồng bộ về
  if(Sync.unsub) Sync.unsub();
  Sync.unsub = ref.onSnapshot(doc=>{
    if(!doc.exists) return;
    const data = doc.data();
    if(data.writeId === Sync.lastWriteId) return; // bỏ qua tiếng vọng của chính mình
    applyRemoteData(data);
    showToast('Đã nhận dữ liệu mới từ thiết bị khác.');
  }, err=>{ /* im lặng nếu mất mạng tạm thời */ });
}
function disconnectSync(){
  if(Sync.unsub) Sync.unsub();
  Sync.unsub=null; Sync.connected=false; Sync.db=null; Sync.code=null;
  localStorage.removeItem('sonthuy_syncConfig');
}
async function autoConnectSyncOnBoot(){
  const saved = LS.get('syncConfig', null);
  if(!saved) return;
  try{
    await ensureFirebaseSDK();
    if(!Sync.app) Sync.app = firebase.initializeApp(saved.config);
    Sync.db = firebase.firestore(); Sync.config = saved.config; Sync.code = saved.code;
    Sync.connected = true;
    const ref = syncDocRef();
    Sync.unsub = ref.onSnapshot(doc=>{
      if(!doc.exists) return;
      const data = doc.data();
      if(data.writeId === Sync.lastWriteId) return;
      applyRemoteData(data);
    }, err=>{});
  }catch(err){ console.warn('Không thể tự kết nối đồng bộ:', err); }
}

/* ---------------------- 5. ÂM THANH — phát âm chuẩn qua speechSynthesis ---------------------- */
let zhVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  // Ưu tiên giọng Trung Quốc đại lục chất lượng cao (Google / Microsoft) nếu trình duyệt có
  zhVoice = voices.find(v=>v.lang==='zh-CN' && /Google|Microsoft|Tingting|Yaoyao/i.test(v.name))
        || voices.find(v=>v.lang==='zh-CN')
        || voices.find(v=>v.lang && v.lang.startsWith('zh'));
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
function speak(text){
  if(!('speechSynthesis' in window)){ showToast('Trình duyệt không hỗ trợ phát âm.'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.82; u.pitch=1.02; u.volume=1;
  if(zhVoice) u.voice = zhVoice;
  speechSynthesis.speak(u);
}

/* ---------------------- 6. ROUTER (hash-based SPA) ---------------------- */
function navigate(view, params={}){
  location.hash = '#'+view + (Object.keys(params).length? '/'+Object.values(params).join('/') : '');
}
window.addEventListener('hashchange', parseRoute);
function parseRoute(){
  const raw = location.hash.replace('#','') || 'dashboard';
  const parts = raw.split('/');
  const view = parts[0];
  let params = {};
  if(view==='category') params = {id:parts[1]};
  if(view==='quiz' && parts[1]) params = {cat:parts[1]};
  State.route = {view, params};
  State.browseMode='browse'; State.fcIndex=0; State.browsePage=1; State.browseQuery='';
  render();
}

  });
  body.querySelectorAll('[data-play]').forEach(b=>b.onclick=(e)=>{e.stopPropagation(); speak(b.dataset.play);});
  body.querySelectorAll('[data-fav]').forEach(b=>b.onclick=async(e)=>{
    e.stopPropagation();
    const word = State.words.find(w=>w.id===b.dataset.fav);
    word.favorite = !word.favorite; await dbPut(word); syncPushDebounced(); renderBrowse(list);
  });

  const searchInput = document.getElementById('browseSearch');
  let searchDebounce;
  searchInput.oninput = (e)=>{
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{ State.browseQuery = e.target.value; State.browsePage = 1; _browseFocusSearch = true; renderBrowse(list); }, 250);
  };
  if(_browseFocusSearch){
    searchInput.focus();
    searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;
    _browseFocusSearch = false;
  }

  const go = (p)=>{ State.browsePage = p; renderBrowse(list); };
  const byId = id=>document.getElementById(id);
  if(byId('pgFirst')) byId('pgFirst').onclick = ()=>go(1);
  if(byId('pgPrev'))  byId('pgPrev').onclick  = ()=>go(State.browsePage-1);
  if(byId('pgNext'))  byId('pgNext').onclick  = ()=>go(State.browsePage+1);
  if(byId('pgLast'))  byId('pgLast').onclick  = ()=>go(totalPages);
  if(byId('pgInput'))  byId('pgInput').onchange = (e)=>{
    let p = parseInt(e.target.value,10); if(isNaN(p)) p=1;
    go(Math.min(totalPages, Math.max(1,p)));
  };
}

async function grade(word, easy, list){
  // Spaced repetition rudimentary: dựa trên số lần học + đánh giá
  word.reviewCount += 1;
  word.familiarity = Math.max(0, Math.min(5, word.familiarity + (easy? 1 : -1)));
  await dbPut(word);
  syncPushDebounced();
  State.fcIndex = (State.fcIndex+1) % list.length;
  renderFlashcards(list);
}

function renderWordList(){
  let list = State.words.filter(w=>{
    if(manageFilter.q){
      const q = manageFilter.q.toLowerCase();
      if(!(w.hz.includes(manageFilter.q) || w.py.toLowerCase().includes(q) || w.nghiaViet.toLowerCase().includes(q) || w.hanViet.toLowerCase().includes(q))) return false;
    }
    if(manageFilter.cat && w.cat!==manageFilter.cat) return false;
    if(manageFilter.fam!=='' && w.familiarity!=Number(manageFilter.fam)) return false;
    if(manageFilter.fav && !w.favorite) return false;
    return true;
  });
  list.sort((a,b)=> a.cat===b.cat ? (a.stt||0)-(b.stt||0) : CATEGORIES.findIndex(c=>c.id===a.cat)-CATEGORIES.findIndex(c=>c.id===b.cat));
  const root = document.getElementById('wordList');
  if(!list.length){ root.innerHTML = `<div class="empty">Không tìm thấy từ vựng phù hợp.</div>`; return; }

        <button class="icon-mini" data-play="${word.id}">🔊</button>
        <button class="icon-mini" data-edit="${word.id}">✎</button>
        <button class="icon-mini" data-del="${word.id}">🗑</button>
      </div>
    </div>
  `).join('');
  root.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>speak(State.words.find(w=>w.id===b.dataset.play).hz));
  root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openWordModal(State.words.find(w=>w.id===b.dataset.edit)));
  root.querySelectorAll('[data-fav]').forEach(b=>b.onclick=async()=>{
    const word = State.words.find(w=>w.id===b.dataset.fav); word.favorite=!word.favorite; await dbPut(word); syncPushDebounced(); renderWordList();
  });
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{

    await dbDelete(b.dataset.del);

    syncPushDebounced();
    renderWordList(); showToast('Đã xóa từ vựng.');
  });
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function startQuiz(catId, type){
  const pool = State.words.filter(w=>w.cat===catId);
  if(pool.length<4){ showToast('Cần ít nhất 4 từ trong mục để tạo câu hỏi.'); return; }
  const qs = shuffle(pool).slice(0, Math.min(10,pool.length)).map(word=>{
    const distractors = shuffle(pool.filter(x=>x.id!==word.id)).slice(0,3);
    const options = shuffle([word, ...distractors]);
    return {word, type, options};
  });
  State.quiz = {qs, i:0, correct:0, mistakes:[]};
  renderQuizQuestion();
}
function renderQuizQuestion(){
  const main = document.getElementById('mainArea');
  const {qs,i} = State.quiz;
  if(i>=qs.length) return renderQuizResult();
  const q = qs[i];
  let questionHTML='', answersHTML='';
  if(q.type==='mc-meaning'){
    questionHTML = `<div class="hz">${q.word.hz}</div><div>${pinyinHTML(q.word.py)}</div>`;
    answersHTML = q.options.map(o=>`<button class="ans-btn" data-id="${o.id}">${o.nghiaViet}</button>`).join('');
  } else if(q.type==='mc-hanzi'){
    questionHTML = `<div style="font-size:20px;margin-bottom:6px;">${q.word.nghiaViet}</div><div class="meta" style="color:var(--fg-soft)">${q.word.hanViet}</div>`;
    answersHTML = q.options.map(o=>`<button class="ans-btn hanzi" data-id="${o.id}" style="font-size:24px;">${o.hz}</button>`).join('');
  } else if(q.type==='listening'){
    questionHTML = `<button class="btn ghost" id="playQ" style="font-size:24px;padding:20px 30px;">🔊 Nghe & chọn chữ đúng</button>`;
    answersHTML = q.options.map(o=>`<button class="ans-btn hanzi" data-id="${o.id}" style="font-size:24px;">${o.hz}</button>`).join('');
  } else if(q.type==='fill'){
    const blanked = q.word.exampleZh.replaceAll(q.word.hz,'___');
    questionHTML = `<div style="font-size:22px;line-height:1.7;">${blanked}</div><div class="meta" style="margin-top:8px;color:var(--fg-soft)">${q.word.exampleVi}</div>`;
    answersHTML = q.options.map(o=>`<button class="ans-btn hanzi" data-id="${o.id}" style="font-size:22px;">${o.hz}</button>`).join('');
  }
  main.innerHTML = `
    <div class="page-head"><h2 class="hanzi">测验 <span class="py">Câu ${i+1} / ${qs.length}</span></h2></div>
    <div class="progressbar quiz-progress"><i style="width:${(i/qs.length)*100}%"></i></div>
    <div class="quiz-q">${questionHTML}</div>
    <div class="quiz-answers">${answersHTML}</div>
  `;
  if(q.type==='listening') document.getElementById('playQ').onclick = ()=>speak(q.word.hz);
  main.querySelectorAll('.ans-btn').forEach(btn=>btn.onclick=()=>answerQuiz(btn, q));
}
async function answerQuiz(btn, q){
  main_lock: {
    document.querySelectorAll('.ans-btn').forEach(b=>b.onclick=null);
  }
  const correctId = q.word.id;
  const chosenId = btn.dataset.id;
  const isCorrect = chosenId===correctId;
  btn.classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect){
    document.querySelectorAll('.ans-btn').forEach(b=>{ if(b.dataset.id===correctId) b.classList.add('correct'); });
    State.quiz.mistakes.push(q.word);
    q.word.familiarity = Math.max(0, q.word.familiarity-1);
  } else {
    State.quiz.correct++;
    q.word.familiarity = Math.min(5, q.word.familiarity+1);
  }
  q.word.reviewCount++;
  await dbPut(q.word);
  syncPushDebounced();
  setTimeout(()=>{ State.quiz.i++; renderQuizQuestion(); }, 900);
}
function renderQuizResult(){
  const {qs, correct, mistakes} = State.quiz;
  const pct = Math.round(correct/qs.length*100);
  const circ = 2*Math.PI*70;
  const main = document.getElementById('mainArea');
  main.innerHTML = `
    <div class="quiz-result fade-in">
      <h2 class="hanzi">测验结果 <span class="py" style="font-size:14px;">Kết quả kiểm tra</span></h2>
      <svg class="donut" viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="70" fill="none" stroke="var(--line)" stroke-width="14"/>
        <circle cx="80" cy="80" r="70" fill="none" stroke="${pct>=70?'var(--jade)':'var(--vermilion)'}" stroke-width="14"
          stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}" stroke-linecap="round" transform="rotate(-90 80 80)"/>
        <text x="80" y="90" text-anchor="middle" font-size="30" font-family="Noto Serif SC" fill="var(--fg)">${pct}%</text>
      </svg>
      <div>Đúng ${correct}/${qs.length} câu</div>
      ${mistakes.length? `<div style="max-width:420px;">
        <div class="meta" style="margin-bottom:8px;color:var(--fg-soft)">Từ cần ôn lại:</div>
        <div class="browse-scroll" style="justify-content:center;">${mistakes.map(wordTile).join('')}</div>
      </div>` : `<div style="color:var(--accent)">Xuất sắc! Bạn đã thuộc toàn bộ từ vựng trong mục này. 🎉</div>`}
      <div style="display:flex;gap:12px;">
        <button class="btn ghost" onclick="renderQuizSetup()">Làm bài khác</button>
        <button class="btn" onclick="navigate('dashboard')">Về trang chủ</button>
      </div>
    </div>
  `;
  main.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>speak(b.dataset.play));
  main.querySelectorAll('[data-fav]').forEach(b=>b.onclick=async()=>{
    const word = State.words.find(w=>w.id===b.dataset.fav); word.favorite=!word.favorite; await dbPut(word); syncPushDebounced();
  });
}

  State.pendingTutorPrompt = `Hãy giải thích chi tiết về từ "${word.hz}" (${word.py} - ${word.nghiaViet}), gợi ý 2-3 từ liên quan, và tạo 1 câu ví dụ mới sử dụng từ này.`;

}

      <div class="tutor-msgs" id="tutorMsgs"></div>
      <div class="tutor-quick">
        <button data-q="grammar">Giải thích ngữ pháp</button>
        <button data-q="example">Tạo câu ví dụ mới</button>
        <button data-q="quiz">Tạo quiz cá nhân hóa</button>
        <button data-q="related">Gợi ý từ liên quan</button>
      </div>
      <div class="tutor-input">
        <input class="input" id="tutorInput" placeholder="Hỏi 山水 về từ vựng, ngữ pháp, văn hóa Trung Hoa...">
        <button class="btn" id="tutorSend">Gửi</button>
      </div>
    </div>
  `;
  renderTutorMsgs();
  document.getElementById('tutorSend').onclick = sendTutorMsg;
  document.getElementById('tutorInput').onkeydown = (e)=>{ if(e.key==='Enter') sendTutorMsg(); };
  main.querySelectorAll('.tutor-quick button').forEach(b=>b.onclick=()=>{
    const map = {
      grammar:'Hãy giải thích một điểm ngữ pháp tiếng Trung phổ biến mà người học hay nhầm lẫn, kèm ví dụ.',
      example:'Hãy tạo 3 câu ví dụ mới sử dụng các từ vựng tôi đang học ở trình độ trung cấp.',
      quiz:'Hãy tạo cho tôi một quiz nhỏ gồm 3 câu hỏi trắc nghiệm về từ vựng HSK trung cấp, kèm đáp án ở cuối.',
      related:'Hãy gợi ý 5 từ vựng liên quan đến chủ đề văn hóa và xã hội Trung Hoa mà tôi nên học tiếp theo.'
    };
    document.getElementById('tutorInput').value = map[b.dataset.q];
    sendTutorMsg();
  });
  if(State.pendingTutorPrompt){
    document.getElementById('tutorInput').value = State.pendingTutorPrompt;
    State.pendingTutorPrompt = null;
    sendTutorMsg();
  }
}
function renderTutorMsgs(){
  const box = document.getElementById('tutorMsgs');
  if(!box) return;
  if(State.tutorHistory.length===0){
    box.innerHTML = `<div class="msg ai">${escapeHTML(CONTENT.tutorWelcome)}</div>`;
    return;
  }
  box.innerHTML = State.tutorHistory.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}">${escapeHTML(m.content)}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}
function escapeHTML(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML.replaceAll('\n','<br>'); }

async function sendTutorMsg(){
  const input = document.getElementById('tutorInput');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  State.tutorHistory.push({role:'user', content:text});
  renderTutorMsgs();
  const box = document.getElementById('tutorMsgs');
  box.insertAdjacentHTML('beforeend', `<div class="msg ai" id="typingMsg"><div class="typing"><i></i><i></i><i></i></div></div>`);
  box.scrollTop = box.scrollHeight;
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: CONTENT.tutorSystemPrompt,
        messages: State.tutorHistory.map(m=>({role:m.role, content:m.content}))
      })
    });
    const data = await resp.json();
    const textOut = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n') || 'Xin lỗi, 山水 chưa thể trả lời lúc này.';
    State.tutorHistory.push({role:'assistant', content:textOut});
  }catch(err){
    State.tutorHistory.push({role:'assistant', content:'Kết nối tới 山水 gặp trục trặc. Vui lòng thử lại sau ít phút. (' + err.message + ')'});
  }
  renderTutorMsgs();
}

/* ---------------------- 14. MAIN RENDER DISPATCH ---------------------- */
function render(){
  buildNav();
  const view = State.route.view;
  if(view==='dashboard') renderDashboard();
  else if(view==='category') renderCategory();
  else if(view==='manage') renderManage();
  else if(view==='quiz') renderQuizSetup();
  else if(view==='tutor') renderTutor();
  else if(view==='settings') renderSettings();
  else renderDashboard();
}

/* ---------------------- 16. KHỞI TẠO ỨNG DỤNG ---------------------- */
async function boot(){
  if(LS.get('dark', false)) document.documentElement.classList.add('dark');
  loadContent();
  document.title = CONTENT.brandTitle + ' · ' + CONTENT.brandSub;
  renderShell();
  document.getElementById('darkToggle').textContent = document.documentElement.classList.contains('dark') ? '☀' : '☾';
  State.words = await seedIfEmpty();
  await migrateMissingStt();
  parseRoute();
  autoConnectSyncOnBoot();
  // Đăng ký service worker cho PWA (nếu file sw.js tồn tại cùng thư mục)
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* bỏ qua nếu chạy dưới dạng file độc lập */ });
  }
}
boot();
